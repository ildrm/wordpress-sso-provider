name: sso-release-test

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-release-test
      MARIADB_ROOT_PASSWORD: root-release-test
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/mysql

  wordpress:
    image: wordpress:7.1.0-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-release-test
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_SSO_MASTER_KEY', 'fedcba9876543210fedcba9876543210');
        define('WP_ENVIRONMENT_TYPE', 'local');
    ports:
      - "8889:80"
    volumes:
      - release_wp_data:/var/www/html

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-release-test
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_SSO_MASTER_KEY', 'fedcba9876543210fedcba9876543210');
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - release_wp_data:/var/www/html
      - ../build:/artifacts:ro
      - ./:/test-harness:ro
    working_dir: /var/www/html
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  release_wp_data:

